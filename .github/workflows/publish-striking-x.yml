name: Publish Woods Run striking item to X

on:
  schedule:
    # GitHub scheduled jobs can start a few minutes late. Run repeatedly across
    # both possible UTC windows; the Python guard and duplicate check make this safe.
    - cron: '0,15,30,45 16,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/striking_trigger.json'

permissions:
  contents: read

concurrency:
  group: woods-run-striking-x-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest site state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate striking-item publisher
        run: python -m py_compile scripts/post_to_buffer.py scripts/post_striking_to_buffer.py

      - name: Publish today's standout observation through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          FORCE_RUN: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && 'true' || 'false' }}
        run: python scripts/post_striking_to_buffer.py
