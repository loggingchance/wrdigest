name: Maintain Woods Run publication surfaces

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - data/issues.json

permissions:
  contents: write

concurrency:
  group: woods-run-maintenance-main
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Maintain homepage, archive, sitemap, and article SEO
        run: python scripts/maintain_seo.py

      - name: Validate generated changes
        run: git diff --check

      - name: Commit maintenance changes
        run: |
          if git diff --quiet; then
            echo "No maintenance changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive/index.html sitemap.xml '20??/??/??/index.html'
          git commit -m "Maintain Woods Run publication surfaces"
          git push origin HEAD:main
