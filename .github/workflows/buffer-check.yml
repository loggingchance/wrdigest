name: Check Buffer connection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/buffer-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-buffer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Buffer publishing script
        run: python -m py_compile scripts/post_to_buffer.py

      - name: Verify Buffer API key and list connected channels
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUFFER_API_KEY:-}" ]; then
            echo "BUFFER_API_KEY secret is missing."
            exit 1
          fi

          org_payload='{"query":"query GetOrganizations { account { organizations { id name } } }"}'
          org_response=$(curl --fail-with-body -sS -X POST 'https://api.buffer.com' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${BUFFER_API_KEY}" \
            -d "$org_payload")

          if echo "$org_response" | jq -e '.errors' >/dev/null; then
            echo "$org_response" | jq .
            exit 1
          fi

          org_id=$(echo "$org_response" | jq -r '.data.account.organizations[0].id // empty')
          org_name=$(echo "$org_response" | jq -r '.data.account.organizations[0].name // empty')
          if [ -z "$org_id" ]; then
            echo "No Buffer organization found."
            exit 1
          fi
          echo "Buffer organization: ${org_name} (${org_id})"

          channels_payload=$(jq -n --arg org "$org_id" '{query:("query GetChannels { channels(input: { organizationId: \"" + $org + "\" }) { id name service } }")}')
          channels_response=$(curl --fail-with-body -sS -X POST 'https://api.buffer.com' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${BUFFER_API_KEY}" \
            -d "$channels_payload")

          if echo "$channels_response" | jq -e '.errors' >/dev/null; then
            echo "$channels_response" | jq .
            exit 1
          fi

          echo "Connected Buffer channels:"
          echo "$channels_response" | jq -r '.data.channels[] | "- \(.service): \(.name) [\(.id)]"'

          x_id=$(echo "$channels_response" | jq -r '.data.channels[] | select(.service == "twitter" and .name == "ForestBizSchool") | .id' | head -n1)
          if [ -z "$x_id" ]; then
            echo "No ForestBizSchool X/Twitter channel is connected in Buffer."
            exit 1
          fi

          posts_payload=$(jq -n --arg org "$org_id" --arg channel "$x_id" '{query:("query RecentPosts { posts(first: 5, input: { organizationId: \"" + $org + "\", filter: { status: [sent, scheduled], channelIds: [\"" + $channel + "\"] }, sort: [{ field: createdAt, direction: desc }] }) { edges { node { id text status createdAt channelId } } } }")}')
          posts_response=$(curl --fail-with-body -sS -X POST 'https://api.buffer.com' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${BUFFER_API_KEY}" \
            -d "$posts_payload")

          if echo "$posts_response" | jq -e '.errors' >/dev/null; then
            echo "$posts_response" | jq .
            exit 1
          fi

          echo "Buffer post-read check succeeded for ForestBizSchool."
