name: Test Woods Run email delivery

on:
  push:
    branches:
      - main
    paths:
      - data/email_test_trigger.json
      - scripts/test_digest_email.py
      - .github/workflows/test-digest-email.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send fake Woods Run digest test through Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/test_digest_email.py
