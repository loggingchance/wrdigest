name: Publish Woods Run email

on:
  push:
    branches: [main]
    paths:
      - 'data/issues.json'
      - 'scripts/publish_digest_email.py'
      - '.github/workflows/publish-digest-email.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woods-run-email
  cancel-in-progress: false

jobs:
  send:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-email]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest site state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish same-date Woods Run broadcast
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WOODS_RUN_SEGMENT_ID: ec27b7e4-84e2-47af-83ce-7d77732ed557
        run: python scripts/publish_digest_email.py
