name: Diagnose Instagram Buffer connection

on:
  push:
    branches: [main]
    paths:
      - 'data/instagram-diagnostic.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query Buffer and independently verify Instagram permalink
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          key=os.environ['BUFFER_API_KEY']
          def gql(q,v=None):
              req=urllib.request.Request('https://api.buffer.com',data=json.dumps({'query':q,'variables':v or {}}).encode(),headers={'Content-Type':'application/json','Authorization':f'Bearer {key}'},method='POST')
              with urllib.request.urlopen(req,timeout=45) as r:
                  x=json.loads(r.read().decode())
              if x.get('errors'):
                  raise SystemExit(json.dumps(x['errors']))
              return x['data']
          def oembed(url):
              endpoint='https://graph.facebook.com/v25.0/instagram_oembed?'+urllib.parse.urlencode({'url':url})
              req=urllib.request.Request(endpoint,headers={'User-Agent':'WoodsRunDigest/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=json.loads(r.read().decode())
                      return {'status':r.status,'author_name':body.get('author_name'),'provider_name':body.get('provider_name'),'thumbnail':bool(body.get('thumbnail_url')),'type':body.get('type')}
              except urllib.error.HTTPError as e:
                  return {'status':e.code,'body':e.read(2000).decode('utf-8','replace')}
              except Exception as e:
                  return {'error':repr(e)}
          org=gql('query { account { organizations { id name } } }')['account']['organizations'][0]
          q='''query C($organizationId: OrganizationId!){ channels(input:{organizationId:$organizationId}){ id name service descriptor type isDisconnected externalLink scopes } }'''
          channels=gql(q,{'organizationId':org['id']})['channels']
          ig=[c for c in channels if c.get('service')=='instagram']
          print('INSTAGRAM_CHANNELS',json.dumps(ig,indent=2))
          for c in ig:
              q2='''query P($organizationId: OrganizationId!,$channelId: ChannelId!){ posts(first:10,input:{organizationId:$organizationId,filter:{status:[sent,scheduled,error],channelIds:[$channelId]},sort:[{field:createdAt,direction:desc}]}){ edges{ node{ id status schedulingType notificationStatus sentAt createdAt updatedAt externalLink error{message rawError supportUrl} text assets{source mimeType} } } } }'''
              posts=[e['node'] for e in gql(q2,{'organizationId':org['id'],'channelId':c['id']})['posts']['edges']]
              print('RECENT_POSTS',json.dumps(posts[:3],indent=2))
              for p in posts[:3]:
                  if p.get('externalLink'):
                      print('OEMBED',p['id'],p['externalLink'],json.dumps(oembed(p['externalLink'])))
          PY
