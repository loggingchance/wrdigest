name: Export Woods Run card previews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/card-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload card previews
        uses: actions/upload-artifact@v4
        with:
          name: woods-run-card-previews
          path: assets/cards/*.png
          if-no-files-found: error
