name: Test GitHub Models access

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test-models.yml
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub Models CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install https://github.com/github/gh-models --force

      - name: Test GitHub Models inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$(gh models run openai/gpt-4.1-mini 'Reply with exactly: MODELS_OK')"
          echo "$out"
          test "$out" = "MODELS_OK"
