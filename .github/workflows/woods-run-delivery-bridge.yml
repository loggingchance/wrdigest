name: Woods Run delivery bridge

on:
  workflow_dispatch:
  schedule:
    # 4:00 / 4:15 Mountain across DST; local-time guard allows the valid pair.
    - cron: '0,15 10 * * *'
    - cron: '0,15 11 * * *'

permissions:
  contents: read

concurrency:
  group: woods-run-delivery-bridge
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check Mountain time
        id: localtime
        shell: bash
        run: |
          HOUR=$(TZ=America/Denver date +%H)
          MINUTE=$(TZ=America/Denver date +%M)
          echo "run=$([[ "$HOUR" == "04" && ("$MINUTE" == "00" || "$MINUTE" == "15") ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Mountain time: $HOUR:$MINUTE"

      - name: Check out credential runner
        if: github.event_name == 'workflow_dispatch' || steps.localtime.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.localtime.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull canonical issue from new Woods Run repository
        if: github.event_name == 'workflow_dispatch' || steps.localtime.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://raw.githubusercontent.com/loggingchance/woods-run-digest/main"
          curl -fsSL "$ROOT/data/issues.json" -o data/issues.json

          ISSUE_DATE=$(python - <<'PY'
          import json
          print(json.load(open("data/issues.json"))[0]["date"])
          PY
          )
          Y=${ISSUE_DATE:0:4}
          M=${ISSUE_DATE:5:2}
          D=${ISSUE_DATE:8:2}

          mkdir -p "$Y/$M/$D" assets/cards assets/videos
          curl -fsSL "$ROOT/$Y/$M/$D/index.html" -o "$Y/$M/$D/index.html"
          curl -fsSL "$ROOT/assets/cards/$ISSUE_DATE.png" -o "assets/cards/$ISSUE_DATE.png"
          curl -fsSL "$ROOT/assets/videos/$ISSUE_DATE.mp4" -o "assets/videos/$ISSUE_DATE.mp4"

          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          issue=json.load(open("data/issues.json"))[0]
          today=datetime.now(ZoneInfo("America/Denver")).date().isoformat()
          if issue["date"] != today:
              raise SystemExit(f"ERROR: canonical staging issue is {issue['date']}, expected {today}")
          print("Canonical staging issue validated:", issue["date"])
          PY

      - name: Send same-date Woods Run email
        if: github.event_name == 'workflow_dispatch' || steps.localtime.outputs.run == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WOODS_RUN_SEGMENT_ID: ec27b7e4-84e2-47af-83ce-7d77732ed557
        run: python scripts/publish_digest_email.py

      - name: Publish same-date social outputs
        if: github.event_name == 'workflow_dispatch' || steps.localtime.outputs.run == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/post_to_buffer.py
