name: Publish FBS quote image to X and Instagram

on:
  push:
    branches: [main]
    paths:
      - 'data/quote_post.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fbs-quote-social-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage today's quote card as a stable public image
        run: python scripts/stage_quote_image.py

      - name: Publish staged image in repository
        run: |
          if [ -z "$(git status --porcelain -- assets/quote-posts)" ]; then
            echo "Quote image is already staged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/quote-posts
            git commit -m "Stage FBS quote card for social publishing"
            git push
          fi

      - name: Publish prepared quote image to X and Instagram through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/post_quote_to_buffer.py

      - name: Verify Instagram post with Meta
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          history = json.loads(Path('data/quote_history.json').read_text(encoding='utf-8'))
          used = history.get('used', [])
          if not used:
              raise SystemExit('No quote history entry was produced; cannot verify Instagram.')

          entry = used[-1]
          url = (entry.get('instagramExternalLink') or '').strip()
          if not url:
              raise SystemExit('Buffer did not return an Instagram permalink.')

          endpoint = 'https://graph.facebook.com/v25.0/instagram_oembed?' + urllib.parse.urlencode({'url': url})
          last_error = None
          for attempt in range(1, 13):
              request = urllib.request.Request(endpoint, headers={'User-Agent': 'WoodsRunDigest/1.0'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  if response.status == 200 and payload.get('provider_name') == 'Instagram' and payload.get('type') == 'rich':
                      print(f'Meta independently confirms the Instagram post is public: {url}')
                      break
                  last_error = f'unexpected oEmbed response: {payload}'
              except Exception as exc:
                  last_error = repr(exc)
              if attempt < 12:
                  print(f'Instagram not independently verifiable yet (attempt {attempt}/12); waiting 5 seconds...')
                  time.sleep(5)
          else:
              raise SystemExit(f'Buffer reported Instagram sent, but Meta did not confirm the public post: {last_error}')
          PY

      - name: Record successful quote posts
        run: |
          if git diff --quiet -- data/quote_history.json; then
            echo "No quote-history change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quote_history.json
          git commit -m "Record FBS quote social posts"
          git push
