name: Publish FBS quote image to X

on:
  push:
    branches: [main]
    paths:
      - 'data/quote_post.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fbs-quote-x-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage the original Dropbox quote card unchanged
        run: python scripts/stage_quote_image.py

      - name: Publish original image in repository
        run: |
          if [ -z "$(git status --porcelain -- assets/quote-posts)" ]; then
            echo "Quote image is already staged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/quote-posts
            git commit -m "Stage original FBS quote card for X publishing"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Original quote image published on attempt ${attempt}."
                break
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" -eq 5 ]; then
                echo "Unable to publish staged quote image after five attempts."
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: Publish prepared original quote image to X through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/post_quote_to_buffer.py

      - name: Record successful quote post
        run: |
          if git diff --quiet -- data/quote_history.json; then
            echo "No quote-history change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quote_history.json
          git commit -m "Record FBS quote X post"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Quote history published on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to publish quote history after five attempts."
              exit 1
            fi
            sleep $((attempt * 2))
          done
