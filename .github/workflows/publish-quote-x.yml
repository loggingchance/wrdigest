name: Publish FBS quote image to X and Instagram

on:
  push:
    branches: [main]
    paths:
      - 'data/quote_post.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fbs-quote-social-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install quote-card renderer dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render today's quote card as a stable public image
        run: python scripts/stage_quote_image.py

      - name: Publish rendered image in repository
        run: |
          if [ -z "$(git status --porcelain -- assets/quote-posts)" ]; then
            echo "Quote image is already staged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/quote-posts
            git commit -m "Stage FBS quote card for social publishing"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Staged quote image published on attempt ${attempt}."
                break
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" -eq 5 ]; then
                echo "Unable to publish staged quote image after five attempts."
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: Publish prepared quote image to X and Instagram through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/post_quote_to_buffer.py

      - name: Record successful quote posts
        run: |
          if git diff --quiet -- data/quote_history.json; then
            echo "No quote-history change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quote_history.json
          git commit -m "Record FBS quote social posts"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Quote history published on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to publish quote history after five attempts."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Best-effort independent Instagram verification
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          history = json.loads(Path('data/quote_history.json').read_text(encoding='utf-8'))
          used = history.get('used', [])
          if not used:
              print('No quote history entry available for advisory Instagram verification.')
              raise SystemExit(0)

          entry = used[-1]
          url = (entry.get('instagramExternalLink') or '').strip()
          if not url:
              print('Buffer did not return an Instagram permalink; skipping advisory verification.')
              raise SystemExit(0)

          endpoint = 'https://graph.facebook.com/v25.0/instagram_oembed?' + urllib.parse.urlencode({'url': url})
          last_error = None
          for attempt in range(1, 4):
              request = urllib.request.Request(endpoint, headers={'User-Agent': 'WoodsRunDigest/1.0'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  if response.status == 200 and payload.get('provider_name') == 'Instagram':
                      print(f'Meta independently confirms the Instagram post is public: {url}')
                      raise SystemExit(0)
                  last_error = f'unexpected oEmbed response: {payload}'
              except Exception as exc:
                  last_error = repr(exc)
              if attempt < 3:
                  time.sleep(5)

          print(f'Advisory only: Meta oEmbed did not independently confirm the post: {last_error}')
          print('The Buffer publish result remains authoritative for workflow success.')
          PY
