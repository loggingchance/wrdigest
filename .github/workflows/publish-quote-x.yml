name: Publish FBS quote image to X

on:
  push:
    branches: [main]
    paths:
      - 'data/quote_post.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fbs-quote-x-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish prepared quote image through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/post_quote_to_buffer.py

      - name: Record successful quote post
        run: |
          if git diff --quiet -- data/quote_history.json; then
            echo "No quote-history change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quote_history.json
          git commit -m "Record FBS quote image post"
          git push
