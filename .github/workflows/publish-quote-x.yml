name: Publish FBS quote image to X and Instagram

on:
  push:
    branches: [main]
    paths:
      - 'data/quote_post.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fbs-quote-social-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage today's quote card as a stable public image
        run: python scripts/stage_quote_image.py

      - name: Publish staged image in repository
        run: |
          if [ -z "$(git status --porcelain -- assets/quote-posts)" ]; then
            echo "Quote image is already staged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/quote-posts
            git commit -m "Stage FBS quote card for social publishing"
            git push
          fi

      - name: Publish prepared quote image to X and Instagram through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/post_quote_to_buffer.py

      - name: Record successful quote posts
        run: |
          if git diff --quiet -- data/quote_history.json; then
            echo "No quote-history change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quote_history.json
          git commit -m "Record FBS quote social posts"
          git push
