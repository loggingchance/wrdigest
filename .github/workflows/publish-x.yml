name: Publish Woods Run to X

on:
  workflow_run:
    workflows: ["Generate Woods Run social cards"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woods-run-x-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest site state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish newest Woods Run issue to X through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/post_to_buffer.py
