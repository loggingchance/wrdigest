name: Generate Woods Run social cards

on:
  push:
    branches: [main]
    paths:
      - 'data/issues.json'
      - 'scripts/generate_social_cards.py'
      - 'assets/woodsrun-header.webp'
      - '.github/workflows/social-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install card dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Generate social cards
        run: python scripts/generate_social_cards.py

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/
          if git diff --cached --quiet; then
            echo "No social-card changes to commit."
          else
            git commit -m "Generate Woods Run social cards"
            git push
          fi
