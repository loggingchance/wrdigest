name: Generate Woods Run social cards

on:
  push:
    branches: [main]
    paths:
      - 'data/issues.json'
      - 'scripts/generate_social_cards.py'
      - 'assets/woodsrun-header.webp'
      - '.github/workflows/social-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: woods-run-social-cards
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install card dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Generate social cards
        run: python scripts/generate_social_cards.py

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/
          if git diff --cached --quiet; then
            echo "No social-card changes to commit."
            exit 0
          fi

          git commit -m "Generate Woods Run social cards"

          # Other Woods Run automation can update main while the card job is
          # running. Retry a rebase/push rather than losing the card to a
          # non-fast-forward race.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Social-card commit published on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Concurrent update detected; retrying social-card push (${attempt}/5)."
            sleep $((attempt * 2))
          done

          echo "Unable to publish social-card commit after five attempts."
          exit 1
